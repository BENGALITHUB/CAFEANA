name: Validate & Test PR

on:
  pull_request:
    branches: [ main, development ]
  workflow_dispatch:

jobs:
  verify:
    name: Build & Verify Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Cafeana Test Suite
        run: node scripts/test-admin-suite.js

      - name: Build Production Bundle
        run: npm run build
